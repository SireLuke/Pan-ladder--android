<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAN View Ladder Prototype</title>
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#0b1020;--panel:#121a30;--ink:#e6ecff;--mut:#8fa0c8;--line:#26335a;--acc:#5ad1ff;--warn:#ffb454;--ok:#7be0a1}
@media (prefers-color-scheme: light){:root{--bg:#f4f6fb;--panel:#fff;--ink:#14203d;--mut:#55658c;--line:#cfd7ea;--acc:#0a6fa8;--warn:#a85a00;--ok:#16794a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
h1{font-size:16px;margin:0}
.syn{color:var(--warn);font-weight:600}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:12px 16px}
@media (max-width:860px){main{grid-template-columns:1fr}}
#stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
canvas{width:100%;display:block;border-radius:6px;background:#050912;touch-action:none}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
button[aria-pressed=true]{border-color:var(--acc);color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=range]{width:100%}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;align-self:start}
aside h2{font-size:15px;margin:0 0 6px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
dt{color:var(--mut)} dd{margin:0;overflow-wrap:anywhere}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px}
.st-implemented{color:var(--ok);border-color:var(--ok)} .st-unval{color:var(--warn);border-color:var(--warn)}
.chk{margin-top:10px;padding:8px;border:1px dashed var(--line);border-radius:6px;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:13px} th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
#tbl{margin-top:10px;max-height:260px;overflow:auto;display:none}
.note{color:var(--mut);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>PAN View Ladder — prototype v0.1</h1>
  <span class="syn">SYNTHETIC DATA ONLY · not Earth, not a real corpus, V8 values are invented</span>
</header>
<main>
  <section id="stage" aria-label="View ladder">
    <canvas id="cv" width="900" height="560" role="img" aria-label="Current level visualization; see the declaration panel and table view for the same information as text"></canvas>
    <div class="bar" id="lv" role="group" aria-label="Jump to level"></div>
    <label for="zoom">Continuous zoom (level <span id="zv">0.0</span>) — drag the canvas to rotate at any level</label>
    <input id="zoom" type="range" min="0" max="5" step="0.01" value="0">
    <div class="bar" id="presets" role="group" aria-label="View presets"><button data-p="0,0,0">Overhead</button><button data-p="35,-50,0">Isometric</button><button data-p="0,-78,0">Second-person (eye level)</button><button data-p="-34,-20,0">Reset</button></div>
    <div style="display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;font-size:13px">
      <label for="yaw">yaw</label><input id="yaw" type="range" min="-180" max="180" step="1" value="-34"><span id="yawv"></span>
      <label for="pit">pitch</label><input id="pit" type="range" min="-90" max="90" step="1" value="-20"><span id="pitv"></span>
      <label for="rol">roll</label><input id="rol" type="range" min="-180" max="180" step="1" value="0"><span id="rolv"></span>
      <label for="pl">5-D plane</label><select id="pl"></select><span><label><input type="checkbox" id="spin"> spin</label></span>
      <label for="pa">5-D angle</label><input id="pa" type="range" min="-180" max="180" step="1" value="0"><span id="pav"></span>
      <label for="tm">time t</label><input id="tm" type="range" min="0" max="39.9" step="0.05" value="0"><span id="tmv"></span>
    </div>
    <div class="note" id="ori"></div>
    <div class="bar"><button id="play" aria-pressed="false">Play time</button><button id="tbtn" aria-pressed="false">Table view</button><button id="auto" aria-pressed="false">Auto-tour</button><button id="chkbtn">Run canonical check</button></div>
  </section>
  <aside aria-live="polite">
    <h2 id="lname"></h2>
    <dl id="decl"></dl>
    <div class="chk" id="chk"></div>
    <div id="tbl"></div>
    <p class="note">View state (zoom, level, rotation) is disposable. Canonical data (the 1,000 facets) is frozen and digest-checked.</p>
  </aside>
</main>
<script>
"use strict";
// ---------- seeded PRNG ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
// ---------- canonical data: 1,000 synthetic facets ----------
const N=1000, LANGS=["en","es","ar","uz-Cyrl","sw","hi"], CATS=6;
const CITY=[{n:"City A",lat:22,lon:34},{n:"City B",lat:30,lon:48},{n:"City C",lat:14,lon:52}];
const NATION={lat0:8,lat1:38,lon0:26,lon1:62};
function mkFacet(i){
  const cat=Math.floor(rnd()*CATS), geo=rnd()<0.18;
  let lat=null,lon=null;
  if(geo){ if(rnd()<0.7){const c=CITY[Math.floor(rnd()*3)];lat=c.lat+gauss()*0.6;lon=c.lon+gauss()*0.6}
           else{lat=NATION.lat0+rnd()*(NATION.lat1-NATION.lat0);lon=NATION.lon0+rnd()*(NATION.lon1-NATION.lon0)} }
  const scored=rnd()<0.6, base=cat/CATS;
  const v8=scored?[0,1,2,3,4,5,6,7].map(k=>clamp(0.5+0.35*Math.sin(cat*1.7+k*0.9)+gauss()*0.12,0,1)):null;
  return {id:"F"+String(i).padStart(4,"0"),title:"Synthetic facet "+i,lang:LANGS[Math.floor(rnd()*LANGS.length)],cat,lat,lon,
    restricted:rnd()<0.04,v8,sd:scored?0.04+rnd()*0.1:null,hy:rnd()<0.75?[0,1,2,3,4].map(k=>clamp(0.5+0.32*Math.sin(cat*1.1+k*1.7)+gauss()*0.15,0,1)):null,snapshot:"2023-01-15 (synthetic)",links:[]};
}
const F=[];for(let i=0;i<N;i++)F.push(mkFacet(i));
// links: each facet links to 3 random facets, biased to same category
for(const f of F){for(let k=0;k<3;k++){let j;do{j=Math.floor(rnd()*N)}while(j===+f.id.slice(1)||(rnd()<0.7&&F[j].cat!==f.cat));f.links.push(j)}}
function digest(o){const s=JSON.stringify(o);let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,"0")}
F.forEach(f=>Object.freeze(f));Object.freeze(F);
const DIGEST0=digest(F);
const hyNull=F.filter(f=>!f.hy).length;
const geoItems=F.filter(f=>f.lat!==null), restrictedN=F.filter(f=>f.restricted).length, nullV8=F.filter(f=>!f.v8).length;
// ---------- PCA (power iteration) for L4 ----------
const sc=F.filter(f=>f.v8&&!f.restricted); const mean=Array(8).fill(0);sc.forEach(f=>f.v8.forEach((x,k)=>mean[k]+=x/sc.length));
const X=sc.map(f=>f.v8.map((x,k)=>x-mean[k]));
function pc(skips){let v=Array(8).fill(0).map(()=>rnd()-0.5);for(let it=0;it<60;it++){const w=Array(8).fill(0);for(const r of X){let d=0;for(let k=0;k<8;k++)d+=r[k]*v[k];for(let k=0;k<8;k++)w[k]+=r[k]*d}
  for(const sk of skips){let d=0;for(let k=0;k<8;k++)d+=w[k]*sk[k];for(let k=0;k<8;k++)w[k]-=d*sk[k]}
  const n=Math.hypot(...w)||1;v=w.map(x=>x/n)}return v}
const pc1=pc([]),pc2=pc([pc1]),pc3=pc([pc1,pc2]);
const dot=(r,p)=>r.reduce((a,x,k)=>a+x*p[k],0);

// UHFE: Phi_tt + g*Phi_t = -c^2 L Phi - kap*(Phi - S_H),  S_H = U_H - 0.5 (scored facets) else 0   [damped wave, formation]
// UDFE: Psi_t = -sum_j w_ij*G_ij*(Psi_i-Psi_j) - lam_i*Psi, G_i = G0*U_D (unscored: neutral default 0.5, flagged)   [flux-form diffusion, decoherence]

const NB=ADJ.map(s=>[...s]),dmax=Math.max(...NB.map(a=>a.length));

const YOU=Math.max(0,F.findIndex(f=>f.lat!==null&&!f.restricted&&Math.hypot(f.lat-CITY[0].lat,f.lon-CITY[0].lon)<0.4));
const SOLP={c:1,kap:0.5,g:0.4,G0:0.8,lam:0.05,T:40};
function runSolver(o={}){const p=Object.assign({},SOLP,o),dt=Math.min(0.5/Math.sqrt(p.c*p.c*2*dmax+p.kap),0.5/(p.G0*dmax)),k=Math.max(1,Math.round(0.1/dt)),steps=Math.round(p.T/dt);
 const Gm=UDv.map(u=>p.G0*(u===null?0.5:u)),Lm=UDv.map(u=>p.lam*(u===null?0.5:u)),S=UHv.map(u=>u===null?0:u-0.5);
 const P=new Float64Array(N),V=new Float64Array(N),Q=new Float64Array(N),dQ=new Float64Array(N);P[YOU]=1;Q[YOU]=1;
 const FP=[],FQ=[];let maxP=0,mass0=1,energyOK=true,prevE=Infinity;
 for(let st=0;st<=steps;st++){
  if(st%k===0){FP.push(Float32Array.from(P));FQ.push(Float32Array.from(Q))}
  for(let i=0;i<N;i++){let lap=0;const a=NB[i];for(let q=0;q<a.length;q++)lap+=P[i]-P[a[q]];V[i]+=dt*(-p.c*p.c*lap-p.kap*(P[i]-S[i])-p.g*V[i])}

  for(let i=0;i<N;i++){let fl=0;const a=NB[i];for(let q=0;q<a.length;q++){const j=a[q];fl+=0.5*(Gm[i]+Gm[j])*(Q[i]-Q[j])}dQ[i]=-fl-Lm[i]*Q[i]}

 let sumQ=0,minQ=Infinity;for(let i=0;i<N;i++){sumQ+=Q[i];minQ=Math.min(minQ,Q[i])}
 return{dt,fdt:dt*k,FP,FQ,maxP,sumQ,minQ,P:Float64Array.from(P)}}
const SOL=runSolver();
const pct=(fr,q)=>{const v=[];for(let t=2;t<fr.length;t+=5)for(let i=0;i<N;i+=3)v.push(Math.abs(fr[t][i]));v.sort((a,b)=>a-b);return v[Math.floor(q*(v.length-1))]||1};
const PREF=Math.max(pct(SOL.FP,0.99),1e-6),QREF=Math.max(pct(SOL.FQ,0.99),1e-6);
const fIdx=()=>Math.min(SOL.FP.length-1,Math.floor((((view.t%40)+40)%40)/SOL.fdt));
const fa=i=>clamp(SOL.FP[fIdx()][i]/PREF,-1,1), fq=i=>clamp(SOL.FQ[fIdx()][i]/QREF,0,1);
// ---------- procedural planet (synthetic) ----------
const blobs=Array.from({length:34},()=>({lat:(rnd()-0.5)*150,lon:(rnd()-0.5)*360,r:6+rnd()*16}));
// ensure nation region is land
blobs.push({lat:23,lon:44,r:28});
const LW=180,LH=90,land=new Float32Array(LW*LH);
for(let y=0;y<LH;y++)for(let x=0;x<LW;x++){const lat=90-(y+.5)*2,lon=-180+(x+.5)*2;let e=0;for(const b of blobs){const dl=Math.min(Math.abs(lon-b.lon),360-Math.abs(lon-b.lon));const d=Math.hypot(lat-b.lat,dl*Math.cos(lat*Math.PI/180));e=Math.max(e,1-d/b.r)}land[y*LW+x]=e}
// ---------- level declarations ----------
const LEVELS=[
 {id:"L0",name:"Blue Marble Earth (synthetic planet)",kind:"observation",space:"Geographic lat/lon + synthetic elevation",crs:"orthographic projection of a spherical datum (placeholder)",src:"Procedural blobs, seed 42 (NOT real topography)",res:"2° grid",rule:"view.geo_to_ortho v0.2 (+yaw/pitch/roll,t)",status:"implemented (synthetic)",gaps:()=>`${N-geoItems.length} of ${N} facets have no location → not shown at L0–L3; ${restrictedN} restricted facets redacted`,warn:"Real build needs a public-domain imagery + elevation pack with version, license, timestamp."},
 {id:"L1",name:"Overhead nation",kind:"observation",space:"Projected map (equirectangular, placeholder)",crs:"lat/lon → plane, no true-scale claim",src:"Synthetic outline + synthetic 'disputed' area",res:"≈ 0.1° pixels",rule:"view.geo_to_plane v0.1",status:"implemented (synthetic)",gaps:()=>`${geoItems.length} geotagged facets; contested area hatched, not resolved`,warn:"A real boundary dataset must be named and versioned; disputes flagged, not decided."},
 {id:"L2",name:"City",kind:"observation",space:"Projected map, city window",crs:"local plane around City A",src:"Synthetic street grid; facets with source-supplied location only",res:"≈ 0.01°",rule:"view.geo_to_plane v0.1",status:"implemented (synthetic)",gaps:()=>`only geotagged facets inside the window; no invented locations`,warn:"Real street/building data may carry share-alike licensing (e.g. ODbL)."},
 {id:"L3",name:"Second person (you are here)",kind:"pivot",space:"Egocentric rings by link-hops",crs:"none: relational, not spatial",src:"Synthetic user position/path (LOCAL ONLY) + facet link graph",res:"hop distance 1–3",rule:"kernel.world_to_person v0.1",status:"implemented (synthetic)",gaps:()=>`restricted facets shown as redacted blocks; ${N-geoItems.length} unlocated facets reachable only by links`,warn:"Personal location/path never leaves the device; excluded from exports and any ledger."},
 {id:"L4",name:"V8 manifold (2-D PCA of 8-D)",kind:"representation",space:"V8 = (h,R,u,d,τ,χ,s,f), PCA projection",crs:"PCA axes from synthetic scores",src:"Invented scores for 60% of facets; the rest null; splats from the solver field",res:"continuous",rule:"kernel.facet_to_v8 v0.1 (UNVALIDATED)",status:"UNVALIDATED exploratory",gaps:()=>`${proj.length} plotted · ${nullV8} null (not scored) not plotted · restricted excluded`,warn:"Proximity here reflects the scoring mapping, not proven structure; V8 stays null unless independently scored."},
 {id:"L5",name:"Fractal library space — 5-D Hydra product space",kind:"representation",space:"5 axes: Bubble Cymatics · Honeycomb · Spider Web · Chiral DNA · Ommatidia (+ t)",crs:"per-facet geometry affinities in [0,1]; axes are typed families, NOT assumed orthogonal",src:"Synthetic affinities (75% assigned, 25% null); fields from the same solver",res:"continuous; 10 rotation planes",rule:"kernel.facet_to_hydra5 v0.1",status:"implemented (synthetic)",gaps:()=>`${hyNull} facets unassigned (null) not plotted · ${restrictedN} restricted excluded`,warn:"A 5-D→3-D view distorts distances; a facet may belong to several geometries or none. Affinity scoring rules must be declared before real use."}
];
// ---------- state (view only) ----------
const view={z:0,yaw:-0.6,pitch:-0.35,roll:0,t:0,play:false,sel:0,depth:3,ang:new Float64Array(10),pl:0,spin:false};
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");

const W=()=>cv.clientWidth, H=()=>Math.round(cv.clientWidth*0.62);
const COL=["#5ad1ff","#ffb454","#7be0a1","#ff7a90","#b69cff","#f0e36a"];
const lbl=(t,x,y,c="#cfe0ff",s=12,al="left")=>{ctx.fillStyle=c;ctx.font=s+"px system-ui,sans-serif";ctx.textAlign=al;ctx.fillText(t,x,y)};
// ---------- 3-D orientation + time (view state only) ----------
// Convention: right-handed, y up, z toward viewer. Order: yaw (about y) -> pitch (about x) -> roll (about z).
function rotate(x,y,z){const cr=Math.cos(view.roll),sr=Math.sin(view.roll),cp=Math.cos(view.pitch),sp=Math.sin(view.pitch),cy=Math.cos(view.yaw),sy=Math.sin(view.yaw);

const PX=(lon,b)=>((lon-b.lon0)/(b.lon1-b.lon0)*2-1)*1.5, PY=(lat,b)=>((lat-b.lat0)/(b.lat1-b.lat0)*2-1)*0.9;
// ---- Gaussian splats: G(x)=a*exp(-1/2 (x-mu)^T S^-1 (x-mu)); a=Phi_H (formation), spread grows with Psi (decoherence)
function sprite(rgb){const c=document.createElement("canvas");c.width=c.height=64;const g=c.getContext("2d"),gr=g.createRadialGradient(32,32,0,32,32,32);
 for(let k=0;k<=8;k++){const t=k/8;gr.addColorStop(t,`rgba(${rgb},${Math.exp(-4.5*t*t).toFixed(3)})`)}g.fillStyle=gr;g.fillRect(0,0,64,64);return c}
const SPR={pos:sprite("90,209,255"),neg:sprite("255,122,144")};
function splat(x,y,r,i){const a=fa(i),q=fq(i);if(Math.abs(a)<0.02&&q<0.02)return;const rad=r*(1+2.2*q);ctx.save();ctx.globalCompositeOperation="lighter";
 ctx.globalAlpha=Math.min(0.55,0.03+0.3*Math.abs(a));ctx.drawImage(a>=0?SPR.pos:SPR.neg,x-rad,y-rad,2*rad,2*rad);
 if(q>0.02){ctx.globalAlpha=Math.min(0.2,q*0.25);ctx.drawImage(SPR.neg,x-rad*1.6,y-rad*1.6,3.2*rad,3.2*rad)}ctx.restore();
 if(!F[i].v8){ctx.save();ctx.setLineDash([2,2]);ctx.strokeStyle="#ffffff88";ctx.beginPath();ctx.arc(x,y,r*0.5,0,7);ctx.stroke();ctx.restore()}}

let CUR=[];function surf(x,y){let s=0;for(const q of CUR){const dx=x-q.x,dy=y-q.y,d2=dx*dx+dy*dy;if(d2<0.12)s+=q.a*Math.exp(-d2/(2*q.s*q.s))}return s}
const dz=(x,y,k=0.12)=>k*2.2*surf(x,y);
